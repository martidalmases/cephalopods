# Dentro del bloque "server { listen 443 ssl; ... }" de la web (p. ej. /etc/nginx/sites-available/trend.cooking).
# El frontend llama a /api/... en el mismo dominio y nginx lo pasa al backend (uvicorn en 127.0.0.1:8000).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # una especie nueva tarda ~15 s en calcularse la primera vez
    }
